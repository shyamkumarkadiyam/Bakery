<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7EFE5"/>
    </radialGradient>

    <!-- Plate Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
    </filter>

    <!-- Cream Sides Gradients -->
    <linearGradient id="creamLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5E4"/>
    </linearGradient>
    <linearGradient id="creamRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E4"/>
      <stop offset="100%" stop-color="#EBE0D0"/>
    </linearGradient>

    <!-- Frosting Gradients -->
    <linearGradient id="frostTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B3C1A"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    <linearGradient id="frostLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854B24"/>
      <stop offset="100%" stop-color="#734220"/>
    </linearGradient>
    <linearGradient id="frostRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F2A13"/>
      <stop offset="100%" stop-color="#3D210F"/>
    </linearGradient>

    <!-- Cherry Gradient -->
    <radialGradient id="cherryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF9B9E"/>
      <stop offset="40%" stop-color="#FF595E"/>
      <stop offset="100%" stop-color="#B21E23"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="100" fill="url(#bgGrad)"/>

  <!-- Plate Drop Shadow -->
  <ellipse cx="64" cy="85" rx="32" ry="11" fill="#E3D5C8" filter="url(#softShadow)"/>

  <!-- Plate Base -->
  <g id="plate">
    <!-- Plate Right Side -->
    <polygon points="60,91 96,73 96,76 60,94" fill="#D9E2EC"/>
    <!-- Plate Left Side -->
    <polygon points="24,73 60,91 60,94 24,76" fill="#F0F4F8"/>
    <!-- Plate Top -->
    <polygon points="60,55 96,73 60,91 24,73" fill="#FFFFFF"/>
    <!-- Plate Inner Rim -->
    <polygon points="30,73 60,88 90,73 60,58" fill="none" stroke="#F0F4F8" stroke-width="1"/>
    <!-- Plate Outer Edge Highlight -->
    <polygon points="24,73 60,91 96,73 60,55" fill="none" stroke="#FFFFFF" stroke-width="0.75"/>
  </g>

  <!-- Cake Drop Shadow on Plate -->
  <polygon points="40,75 66,88 92,75 66,62" fill="#D9E2EC" opacity="0.8"/>

  <!-- Cake Bottom Trim (Chocolate) -->
  <g id="cake-trim">
    <polygon points="34,70 60,83 60,85 34,72" fill="#734220"/>
    <polygon points="60,83 86,70 86,72 60,85" fill="#3D210F"/>
    <!-- Trim Edge Highlight -->
    <polyline points="34,70 60,83 86,70" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Cake Cream Sides -->
  <g id="cake-sides">
    <polygon points="34,48 60,61 60,83 34,70" fill="url(#creamLeft)"/>
    <polygon points="60,61 86,48 86,70 60,83" fill="url(#creamRight)"/>
    <!-- Center Edge Highlight -->
    <line x1="60" y1="61" x2="60" y2="83" stroke="#FFFFFF" stroke-width="0.75" opacity="0.6"/>
  </g>

  <!-- Cake Frosting with Geometric Drips -->
  <g id="cake-frosting">
    <!-- Frosting Right Side (with drip) -->
    <polygon points="60,58 86,45 86,48 72,55 72,60 68,62 68,57 60,61" fill="url(#frostRight)"/>
    <!-- Frosting Left Side (with drip) -->
    <polygon points="34,45 60,58 60,61 46,54 46,58 42,56 42,52 34,48" fill="url(#frostLeft)"/>
    <!-- Frosting Top -->
    <polygon points="60,32 86,45 60,58 34,45" fill="url(#frostTop)"/>
    
    <!-- Frosting Highlights -->
    <polyline points="34,45 60,58 86,45" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.25"/>
    <polyline points="60,58 60,61" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>
    <!-- Top Glossy Reflection -->
    <polygon points="38,45 56,54 60,52 42,43" fill="#FFFFFF" opacity="0.08"/>
  </g>

  <!-- Sprinkles -->
  <g id="sprinkles" stroke-width="1.2" stroke-linecap="round">
    <!-- Pink Sprinkles -->
    <line x1="45" y1="42" x2="48" y2="44" stroke="#FF99C8"/>
    <line x1="68" y1="48" x2="66" y2="51" stroke="#FF99C8"/>
    <line x1="52" y1="38" x2="55" y2="39" stroke="#FF99C8"/>
    
    <!-- Blue Sprinkles -->
    <line x1="65" y1="40" x2="63" y2="43" stroke="#A9DEF9"/>
    <line x1="50" y1="54" x2="53" y2="53" stroke="#A9DEF9"/>
    <line x1="75" y1="52" x2="73" y2="54" stroke="#A9DEF9"/>
    
    <!-- Yellow Sprinkles -->
    <line x1="75" y1="47" x2="72" y2="47" stroke="#FCF6BD"/>
    <line x1="78" y1="44" x2="80" y2="46" stroke="#FCF6BD"/>
    <line x1="42" y1="48" x2="44" y2="46" stroke="#FCF6BD"/>
    
    <!-- Green Sprinkles -->
    <line x1="55" y1="52" x2="58" y2="50" stroke="#D0F4DE"/>
    <line x1="48" y1="48" x2="50" y2="46" stroke="#D0F4DE"/>
    
    <!-- White Sprinkles -->
    <line x1="40" y1="48" x2="43" y2="49" stroke="#FFFFFF"/>
    <line x1="58" y1="40" x2="55" y2="41" stroke="#FFFFFF"/>
    <line x1="68" y1="44" x2="70" y2="43" stroke="#FFFFFF"/>
  </g>

  <!-- Center Decoration: Dollop of Cream -->
  <g id="cream-dollop">
    <!-- Dollop Shadow -->
    <path d="M 60 47.5 Q 64 46 66 45 Q 64 38 60 34 Q 61 40 60 47.5 Z" fill="#E2E8F0" opacity="0.8"/>
    <!-- Dollop Body -->
    <path d="M 54 45 Q 60 50 66 45 Q 64 38 60 34 Q 56 38 54 45 Z" fill="#FFFFFF"/>
    <!-- Dollop Swirl Lines -->
    <path d="M 56 43 Q 60 46 62 42" fill="none" stroke="#F0F4F8" stroke-width="0.75" stroke-linecap="round"/>
    <path d="M 58 39 Q 60 42 64 43" fill="none" stroke="#F0F4F8" stroke-width="0.75" stroke-linecap="round"/>
  </g>

  <!-- Center Decoration: Cherry -->
  <g id="cherry">
    <!-- Cherry Drop Shadow on Dollop -->
    <ellipse cx="60" cy="34" rx="2.5" ry="1.2" fill="#000000" opacity="0.15"/>
    <!-- Cherry Body -->
    <circle cx="60" cy="30.5" r="3.5" fill="url(#cherryGrad)"/>
    <!-- Cherry Highlight -->
    <circle cx="58.5" cy="29" r="1" fill="#FFFFFF" opacity="0.85"/>
    <!-- Cherry Stem -->
    <path d="M 60 27.5 Q 61 22 65 23" fill="none" stroke="#4A4A4A" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <!-- Plate Decorations (Cocoa Powder Dusting) -->
  <g id="plate-dust" fill="#C4A484" opacity="0.7">
    <circle cx="38" cy="72" r="0.5"/>
    <circle cx="42" cy="76" r="0.7"/>
    <circle cx="40" cy="79" r="0.4"/>
    <circle cx="46" cy="82" r="0.6"/>
    <circle cx="78" cy="72" r="0.6"/>
    <circle cx="82" cy="75" r="0.4"/>
    <circle cx="76" cy="78" r="0.5"/>
    <circle cx="86" cy="68" r="0.5"/>
  </g>
</svg>